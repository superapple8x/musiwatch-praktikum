name: P3 Sync Integration Test

on:
  push:
    paths:
      - "p3-sync/api/**"
      - "p3-sync/scripts/test_sync.sh"
      - ".github/workflows/p3-sync-test.yml"
  pull_request:
    paths:
      - "p3-sync/api/**"
      - "p3-sync/scripts/test_sync.sh"
      - ".github/workflows/p3-sync-test.yml"
  workflow_dispatch:

jobs:
  sync-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: musiwatch
          POSTGRES_USER: musiwatch
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U musiwatch -d musiwatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: python -m pip install -r p3-sync/api/requirements.txt
      - name: Initialize database schema
        env:
          PGPASSWORD: test-password
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -h localhost -U musiwatch -d musiwatch -f p3-sync/api/db/001_init.sql
      - name: Start API
        env:
          DATABASE_URL: postgresql://musiwatch:test-password@localhost:5432/musiwatch
        run: |
          cd p3-sync/api
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/musiwatch-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/health/ready; then
              echo
              exit 0
            fi
            sleep 2
          done
          cat /tmp/musiwatch-api.log
          exit 1
      - name: Run six sync scenarios
        run: bash p3-sync/scripts/test_sync.sh
