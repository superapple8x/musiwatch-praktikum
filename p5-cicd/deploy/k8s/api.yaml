# Sumber: Bahan Ajar Contoh 5.2 + Modul P2 Langkah 4.
# P5: image diganti `kubectl set image` oleh pipeline; kunci JWT dipasang dari Secret `jwt-keys`.
apiVersion: apps/v1
kind: Deployment
metadata: { name: musiwatch-api }
spec:
  replicas: 3
  selector: { matchLabels: { app: musiwatch-api } }
  template:
    metadata: { labels: { app: musiwatch-api } }
    spec:
      containers:
      - name: api
        image: musiwatch/api:placeholder
        imagePullPolicy: IfNotPresent
        ports: [{ containerPort: 8000 }]
        envFrom: [{ secretRef: { name: api-secret } }]
        env:
        - { name: JWT_PRIVATE_KEY_FILE, value: /run/secrets/jwt/jwt_private.pem }
        - { name: JWT_PUBLIC_KEY_FILE, value: /run/secrets/jwt/jwt_public.pem }
        volumeMounts: [{ name: jwt, mountPath: /run/secrets/jwt, readOnly: true }]
        resources:
          requests: { cpu: 500m, memory: 512Mi }
          limits: { cpu: "1", memory: 1Gi }
        readinessProbe: { httpGet: { path: /health/ready, port: 8000 } }
        livenessProbe: { httpGet: { path: /health/live, port: 8000 } }
      volumes:
      - name: jwt
        secret: { secretName: jwt-keys }
---
apiVersion: v1
kind: Service
metadata: { name: musiwatch-api }
spec:
  selector: { app: musiwatch-api }
  ports: [{ port: 80, targetPort: 8000 }]
