# TAMBAHAN: database staging sementara (modul menyebut "postgres + ConfigMap skema + Service db").
# ConfigMap `db-schema` dan Secret `db-secret` dibuat oleh deploy/scripts/create-staging-secrets.sh;
# sampai keduanya ada, Pod menunggu (ContainerCreating) lalu jalan otomatis.
apiVersion: apps/v1
kind: Deployment
metadata: { name: db }
spec:
  replicas: 1
  selector: { matchLabels: { app: db } }
  template:
    metadata: { labels: { app: db } }
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - { name: POSTGRES_DB, value: musiwatch }
        - { name: POSTGRES_USER, value: musiwatch }
        - name: POSTGRES_PASSWORD
          valueFrom: { secretKeyRef: { name: db-secret, key: password } }
        ports: [{ containerPort: 5432 }]
        readinessProbe:
          exec: { command: ["pg_isready", "-U", "musiwatch", "-d", "musiwatch"] }
          periodSeconds: 5
        volumeMounts: [{ name: schema, mountPath: /docker-entrypoint-initdb.d, readOnly: true }]
      volumes:
      - name: schema
        configMap: { name: db-schema }
---
apiVersion: v1
kind: Service
metadata: { name: db }
spec:
  selector: { app: db }
  ports: [{ port: 5432, targetPort: 5432 }]
