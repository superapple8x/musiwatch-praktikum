# Sumber: Modul Praktikum P2, Langkah 3.
# TAMBAHAN: `build` agar image dibangun otomatis; port DB hanya di 127.0.0.1 untuk pytest lokal.
# P4b: Prometheus (127.0.0.1:9090) dan Grafana (127.0.0.1:3000).
# P4a: API di belakang Caddy (TLS), kunci JWT dari deploy/secrets.
# P3 Langkah 1: skema dimuat otomatis dari api/db saat volume data masih kosong.
services:
  db:
    image: postgres:16-alpine   # bila pindah ke postgres:18: mount volume ke /var/lib/postgresql
    environment:
      POSTGRES_DB: musiwatch
      POSTGRES_USER: musiwatch
      POSTGRES_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di file .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ../api/db:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musiwatch -d musiwatch"]
      interval: 5s
      retries: 10
  api:
    image: musiwatch/api:0.5.0
    build: { context: ../api }
    environment:
      DATABASE_URL: postgresql://musiwatch:${DB_PASSWORD}@db:5432/musiwatch
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt/jwt_private.pem
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt/jwt_public.pem
      SUMMARY_MODE: ${SUMMARY_MODE:-n1}   # P4b: n1 (E1, E2) atau groupby (E3)
    volumes: ["./secrets:/run/secrets/jwt:ro"]
    expose: ["8000"]          # P4a: API tidak lagi dibuka ke host; hanya lewat Caddy
    depends_on:
      db: { condition: service_healthy }
    deploy:
      resources: { limits: { cpus: "0.5", memory: 256M } }
  caddy:
    image: caddy:2.8-alpine
    ports: ["8443:8443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    depends_on: [api]
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana:11.2.0
    ports: ["127.0.0.1:3000:3000"]
    volumes: ["./observability/grafana/provisioning:/etc/grafana/provisioning:ro"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # lab saja
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
volumes:
  dbdata:
